<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Reader</title>

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#6b4423">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Bible">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>📖 Bible Reader</h1>

        <!-- Search bar -->
        <div class="search-bar">
            <input type="search" id="searchInput" placeholder="Search the Bible… (e.g. love, grace, born again)"
                autocomplete="off">
            <button id="clearSearchBtn" title="Clear" type="button">✕</button>
        </div>

        <nav class="controls">
            <select id="bookSelect"></select>
            <select id="chapterSelect"></select>
            <button id="prevBtn" type="button">← Prev</button>
            <button id="nextBtn" type="button">Next →</button>
            <button id="bookmarksBtn" type="button" title="Bookmarks">🔖</button>
            <button id="settingsBtn" type="button" title="Reading settings">⚙</button>
            <button id="themeBtn" type="button">🌙</button>
        </nav>
    </header>

    <main id="reader">
        <p class="loading">Loading…</p>
    </main>

    <footer>
        <p>King James Version (Public Domain)</p>
    </footer>

    <!-- Search results overlay -->
    <div id="searchResults" class="search-results hidden">
        <div class="search-results-header">
            <span id="searchStatus">Search</span>
            <button id="closeSearchBtn" type="button">✕ Close</button>
        </div>
        <div id="searchResultsList"></div>
    </div>

    <!-- Floating verse toolbar -->
    <div id="verseToolbar" class="verse-toolbar hidden">
        <button class="vt-btn" id="vtBookmark" title="Bookmark" type="button">🔖</button>
        <button class="vt-btn" id="vtCopy" title="Copy verse" type="button">📋</button>
        <button class="vt-btn" id="vtLink" title="Copy link to verse" type="button">🔗</button>
        <span class="vt-divider"></span>
        <button class="vt-color" data-color="yellow" title="Yellow" type="button"></button>
        <button class="vt-color" data-color="green" title="Green" type="button"></button>
        <button class="vt-color" data-color="blue" title="Blue" type="button"></button>
        <button class="vt-color" data-color="pink" title="Pink" type="button"></button>
        <button class="vt-color" data-color="purple" title="Purple" type="button"></button>
        <span class="vt-divider"></span>
        <button class="vt-btn" id="vtClear" title="Clear" type="button">✕</button>
        <button class="vt-btn" id="vtClose" title="Close" type="button">×</button>
    </div>

    <!-- Bookmarks panel -->
    <div id="bookmarksPanel" class="bookmarks-panel hidden">
        <div class="bookmarks-header">
            <span>🔖 Bookmarks</span>
            <button id="closeBookmarksBtn" type="button">✕ Close</button>
        </div>
        <div id="bookmarksList"></div>
    </div>

    <!-- Settings panel -->
    <div id="settingsPanel" class="settings-panel hidden">
        <div class="settings-header">
            <span>⚙ Reading Settings</span>
            <button id="closeSettingsBtn" type="button">✕ Close</button>
        </div>

        <div class="settings-body">
            <label class="setting">
                <span>Font size <em id="fontSizeVal">18px</em></span>
                <input type="range" id="fontSizeRange" min="14" max="28" step="1">
            </label>

            <label class="setting">
                <span>Font family</span>
                <select id="fontFamilySelect">
                    <option value="serif">Serif (classic)</option>
                    <option value="sans">Sans-serif (modern)</option>
                    <option value="mono">Monospace</option>
                    <option value="dyslexic">Dyslexic-friendly</option>
                </select>
            </label>

            <label class="setting">
                <span>Line spacing <em id="lineHeightVal">1.7</em></span>
                <input type="range" id="lineHeightRange" min="1.4" max="2.4" step="0.1">
            </label>

            <label class="setting">
                <span>Text width <em id="contentWidthVal">720px</em></span>
                <input type="range" id="contentWidthRange" min="560" max="920" step="20">
            </label>

            <button id="resetSettingsBtn" class="reset-btn" type="button">Reset to defaults</button>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>

</html>
